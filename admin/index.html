<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Quản trị Betagon</title>
<link rel="icon" href="/assets/logo-mark.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/admin/vendor/quill/quill.snow.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<!-- login / forced password change -->
<div class="gate" id="gate" hidden>
  <form class="gate-card" id="loginForm" autocomplete="on">
    <div class="brand"><span class="mark"></span>Betagon<small>ADMIN</small></div>
    <h1>Đăng nhập quản trị</h1>
    <label>Tên đăng nhập<input name="username" autocomplete="username" required value="admin"></label>
    <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn primary" type="submit">Đăng nhập</button>
    <a class="muted-link" href="/">← Về website</a>
  </form>
  <form class="gate-card" id="firstPwdForm" hidden>
    <div class="brand"><span class="mark"></span>Betagon<small>ADMIN</small></div>
    <h1>Đặt mật khẩu mới</h1>
    <p class="muted">Đây là lần đăng nhập đầu tiên. Bạn đặt mật khẩu riêng (ít nhất 8 ký tự) để bảo vệ trang quản trị.</p>
    <label>Mật khẩu hiện tại<input name="current" type="password" autocomplete="current-password" required></label>
    <label>Mật khẩu mới<input name="next" type="password" autocomplete="new-password" minlength="8" required></label>
    <label>Nhập lại mật khẩu mới<input name="again" type="password" autocomplete="new-password" minlength="8" required></label>
    <p class="err" id="firstPwdErr" hidden></p>
    <button class="btn primary" type="submit">Lưu mật khẩu</button>
  </form>
</div>

<!-- app -->
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><span class="mark"></span>Betagon<small>ADMIN</small></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <a class="btn ghost" href="/" target="_blank" rel="noopener">Xem website ↗</a>
      <button class="btn ghost" id="logoutBtn">Đăng xuất</button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <button class="burger" id="burger" aria-label="Mở menu">☰</button>
      <h1 id="viewTitle"></h1>
      <div class="top-act" id="topAct"></div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/admin/vendor/quill/quill.min.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
