<section id="contact" class="{{cls}}">
  <div class="wrap">
    <div class="cta-box">
      <div>
        {{{head}}}
        <div class="contact-list">
          <div class="ci"><span class="i"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span><div><small>Địa chỉ</small><span>{{address}}</span></div></div>
          <div class="ci"><span class="i"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></span><div><small>Hotline</small><span>{{hotline}}</span></div></div>
          <div class="ci"><span class="i"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span><div><small>Email</small><span>{{email}}</span></div></div>
          <div class="ci"><span class="i"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><div><small>Giờ làm việc</small><span>{{hours}}</span></div></div>
        </div>
      </div>
      <form id="regForm" novalidate>
        <div class="row2">
          <div class="field"><label for="f-name">Họ và tên</label><input id="f-name" name="name" autocomplete="name" placeholder="Nguyễn Văn A" required></div>
          <div class="field"><label for="f-phone">Số điện thoại</label><input id="f-phone" name="phone" type="tel" autocomplete="tel" placeholder="09xx xxx xxx" required></div>
        </div>
        <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" placeholder="ban@email.com"></div>
        <div class="row2">
          <div class="field"><label for="f-course">Khóa học đăng ký</label><select id="f-course" name="course"></select></div>
          <div class="field"><label for="f-mode">Hình thức</label><select id="f-mode" name="mode"><option>Học tại lớp</option><option>Học online</option><option>Chưa chắc, cần tư vấn</option></select></div>
        </div>
        <div class="field"><label for="f-note">Ghi chú (lịch học mong muốn, mục tiêu...)</label><textarea id="f-note" name="note" rows="3" placeholder="Ví dụ: mình học kiến trúc năm 2, muốn làm thêm diễn họa nội thất"></textarea></div>
        <div style="position:absolute;left:-9999px" aria-hidden="true"><label for="f-web">Website</label><input id="f-web" name="website" tabindex="-1" autocomplete="off"></div>
        <p class="err" id="formErr" hidden></p>
        <button class="btn btn-primary" type="submit" style="justify-content:center">Đăng ký khóa học</button>
        <p class="form-note">Thông tin của bạn chỉ dùng để xác nhận đăng ký và tư vấn khóa học.</p>
        <div class="ok" id="formOk" hidden></div>
      </form>
    </div>
  </div>
</section>
